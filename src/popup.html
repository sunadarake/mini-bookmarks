<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>Mini Bookmarks</title>
        <link rel="stylesheet" href="common.css" />
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="header-left">
                    <button id="open-tab-btn" class="btn">↗</button>
                    <button id="menu-btn" class="btn menu-btn" aria-label="オプションを開く">☰</button>
                </div>
                <div class="header-title">
                    <img src="../assets/img/icon_128.png" alt="icon" class="header-icon" />
                    <span class="header-name">MiniBookmark</span>
                </div>
                <div class="header-right">
                    <span id="total-count">Total: 0</span>
                    <button id="add-btn" class="btn btn-success">Add +</button>
                </div>
            </div>
            <div class="view-switch">
                <button id="view-all-btn" class="view-btn active">すべて</button>
                <button id="view-fav-btn" class="view-btn">お気に入り</button>
            </div>
            <input
                type="text"
                id="search"
                class="search-input"
                placeholder="Search..."
            />
            <select id="sort-select" class="sort-select">
                <option value="newest">新しい順</option>
                <option value="oldest">古い順</option>
                <option value="title">タイトル順</option>
                <option value="site">サイト順</option>
                <option value="manual">手動順</option>
            </select>
            <ul id="bookmark-list" class="bookmark-list"></ul>
        </div>
        <script type="module" src="popup.js"></script>
    </body>
</html>
