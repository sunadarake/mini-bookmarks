<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>Mini Bookmarks Options</title>
        <link rel="stylesheet" href="common.css" />
    </head>
    <body class="options-page">
        <div class="container">
            <div class="header">
                <div class="header-left"></div>
                <div class="header-title">
                    <img src="../assets/img/icon_128.png" alt="icon" class="header-icon" />
                    <span class="header-name">MiniBookmark</span>
                </div>
                <div class="header-right"></div>
            </div>
            <div id="message" class="alert hidden" role="status"></div>
            <div class="section">
                <h3>設定</h3>
                <label class="setting-row">
                    <input type="checkbox" id="confirm-delete" />
                    <span>削除前に確認する</span>
                </label>
                <label class="setting-row setting-row-select">
                    <span>一度に表示する記事数</span>
                    <select id="page-size" class="setting-select">
                        <option value="10">10 件</option>
                        <option value="20">20 件</option>
                        <option value="30">30 件</option>
                        <option value="40">40 件</option>
                        <option value="50">50 件</option>
                        <option value="60">60 件</option>
                        <option value="70">70 件</option>
                        <option value="80">80 件</option>
                        <option value="90">90 件</option>
                        <option value="100">100 件</option>
                    </select>
                </label>
            </div>
            <div class="section">
                <h3>エクスポート</h3>
                <p class="section-desc">
                    保存した記事を JSON ファイルとして書き出します。
                </p>
                <button id="export-btn" class="btn btn-primary">JSON を保存</button>
            </div>
            <div class="section">
                <h3>インポート</h3>
                <p class="section-desc">
                    書き出した JSON を読み込み、記事を追加します。
                </p>
                <div
                    id="drop-zone"
                    class="drop-zone"
                    role="button"
                    tabindex="0"
                    aria-label="JSON ファイルを選択"
                >
                    <p class="drop-zone-title">JSON ファイルをドロップ</p>
                    <p class="drop-zone-hint">またはクリックして選択</p>
                </div>
                <input type="file" id="file-input" accept=".json,application/json" />
                <p id="preview" class="preview"></p>
                <button id="save-btn" class="btn btn-primary" disabled>保存</button>
            </div>
            <div id="version" class="version"></div>
        </div>
        <script type="module" src="options.js"></script>
    </body>
</html>
