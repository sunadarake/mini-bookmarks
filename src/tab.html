<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>Mini Bookmarks</title>
        <link rel="stylesheet" href="common.css" />
        <link rel="stylesheet" href="tab.css" />
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="header-left">
                    <button id="menu-btn" class="btn menu-btn" aria-label="オプションを開く">☰</button>
                    <span id="total-count">Total: 0</span>
                </div>
                <div class="header-title">
                    <img src="../assets/img/icon_128.png" alt="icon" class="header-icon" />
                    <span class="header-name">MiniBookmark</span>
                </div>
                <div class="header-right"></div>
            </div>
            <div class="view-switch">
                <button id="view-all-btn" class="view-btn active">すべて</button>
                <button id="view-fav-btn" class="view-btn">お気に入り</button>
            </div>
            <input
                type="text"
                id="search"
                class="search-input"
                placeholder="記事タイトルを検索..."
            />
            <div class="sort-toggle" role="group" aria-label="並び順">
                <button type="button" id="sort-newest" class="sort-btn active">新しい順</button>
                <button type="button" id="sort-oldest" class="sort-btn">古い順</button>
            </div>
            <div class="site-filter">
                <input
                    type="text"
                    id="site-search"
                    class="search-input"
                    placeholder="Site..."
                />
                <div class="site-select-wrap">
                    <button
                        type="button"
                        id="site-select-trigger"
                        class="site-select-trigger"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                    >
                        <img id="site-favicon" class="site-favicon" alt="" hidden />
                        <span id="site-select-label" class="site-select-label">すべてのサイト</span>
                        <span class="site-select-caret" aria-hidden="true">▾</span>
                    </button>
                    <ul id="site-select-menu" class="site-select-menu" role="listbox" hidden></ul>
                </div>
            </div>
            <ul id="bookmark-list" class="bookmark-list"></ul>
        </div>
        <script type="module" src="tab.js"></script>
    </body>
</html>
